<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>SpendWise - Personal Finance Tracker</title>
    <meta name="description" content="Track your expenses, manage wallets, and gain financial insights with SpendWise PWA" />
    <meta name="author" content="SpendWise" />
    <meta name="theme-color" content="#10b981" />
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SpendWise" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="SpendWise - Personal Finance Tracker" />
    <meta property="og:description" content="Track your expenses, manage wallets, and gain financial insights" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SpendWise - Personal Finance Tracker" />
    <meta name="twitter:description" content="Track your expenses and manage your finances" />
    
    <!-- Safe Area for iOS -->
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }
      .pb-safe {
        padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
